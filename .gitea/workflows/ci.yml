name: Ontology smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Run both engines sequentially — Virtuoso and Fuseki. Each
      # builds its image from repo root (ontology/ + fixtures are
      # COPYed in), spins a container, loads TBox + fixtures, runs
      # the verification queries, diffs against expected output,
      # exits non-zero on any mismatch.
      #
      # Why both: Phase 0 surfaced that NEITHER engine implements
      # owl:propertyChainAxiom from the declared TBox. Their
      # workarounds have different drift properties, and the
      # comparison informed the Phase 1 substrate decision.
      # See tools/smoke/COMPARISON.md.
      - name: Run both reasoner smokes
        run: bash tools/smoke/run-all.sh

      # Surface the smoke status to the PR via job result; merge to
      # main is gated on this passing.
