# Grafana dashboard ConfigMap for the Virtuoso pod.
#
# Discovery: kube-prometheus-stack's grafana sidecar picks up
# any ConfigMap labelled `grafana_dashboard: "1"` and mounts
# its data into Grafana as a JSON dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-virtuoso-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: virtuoso
data:
  virtuoso.json: |
    {
      "title": "Virtuoso",
      "uid": "virtuoso",
      "tags": ["virtuoso", "gmr", "data"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "type": "datasource",
            "name": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Up",
          "datasource": "${datasource}",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "targets": [{ "expr": "virtuoso_up", "refId": "A" }],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" } } },
                { "type": "value", "options": { "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Uptime",
          "datasource": "${datasource}",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "targets": [{ "expr": "virtuoso_uptime_seconds", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "stat",
          "title": "DB size",
          "datasource": "${datasource}",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "targets": [{ "expr": "virtuoso_db_file_bytes", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "decbytes" } }
        },
        {
          "type": "stat",
          "title": "Backup age",
          "datasource": "${datasource}",
          "description": "Seconds since last successful virtuoso-backup CronJob run.",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "time() - kube_cronjob_status_last_successful_time{namespace=\"gmr\",cronjob=\"virtuoso-backup\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 86400 },
                  { "color": "red", "value": 90000 }
                ]
              }
            }
          },
          "options": { "colorMode": "background" }
        },
        {
          "type": "timeseries",
          "title": "SPARQL ASK latency (probe)",
          "datasource": "${datasource}",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            { "expr": "histogram_quantile(0.5, sum by (le) (rate(virtuoso_sparql_ask_duration_seconds_bucket[5m])))",  "legendFormat": "p50",  "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(virtuoso_sparql_ask_duration_seconds_bucket[5m])))", "legendFormat": "p95",  "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(virtuoso_sparql_ask_duration_seconds_bucket[5m])))", "legendFormat": "p99",  "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "timeseries",
          "title": "Buffer pool",
          "datasource": "${datasource}",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            { "expr": "virtuoso_buffers_used",  "legendFormat": "used",  "refId": "A" },
            { "expr": "virtuoso_buffers_dirty", "legendFormat": "dirty", "refId": "B" },
            { "expr": "virtuoso_buffers_total", "legendFormat": "total", "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Threads + clients",
          "datasource": "${datasource}",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            { "expr": "virtuoso_threads_running",   "legendFormat": "threads running", "refId": "A" },
            { "expr": "virtuoso_threads_waiting",   "legendFormat": "threads waiting", "refId": "B" },
            { "expr": "virtuoso_clients_concurrent","legendFormat": "clients",         "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Process memory",
          "datasource": "${datasource}",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            { "expr": "virtuoso_rss_bytes", "legendFormat": "RSS", "refId": "A" },
            { "expr": "virtuoso_vsz_bytes", "legendFormat": "VSZ", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "decbytes" } }
        },
        {
          "type": "timeseries",
          "title": "DB pages",
          "datasource": "${datasource}",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "targets": [
            { "expr": "virtuoso_db_pages_total", "legendFormat": "total", "refId": "A" },
            { "expr": "virtuoso_db_pages_total - virtuoso_db_pages_free", "legendFormat": "used", "refId": "B" },
            { "expr": "virtuoso_pages_changed_since_backup", "legendFormat": "changed since last backup", "refId": "C" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Probe failures",
          "datasource": "${datasource}",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "targets": [
            { "expr": "rate(virtuoso_sparql_ask_failures_total[5m])", "legendFormat": "ASK probe fail/s", "refId": "A" }
          ]
        }
      ]
    }
