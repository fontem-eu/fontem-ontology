# Vault-managed dba password, synced into fontem-prod by VSO.
#
# PREREQUISITE: the Vault entry must exist before applying:
#   vault kv put secret/fontem-prod/virtuoso \
#       VIRTUOSO_DBA_USER=dba \
#       VIRTUOSO_DBA_PASSWORD="$(openssl rand -base64 32)"
#
# VSO syncs `secret/fontem-prod/virtuoso` into the K8s Secret
# named `virtuoso-credentials` in fontem-prod (created by VSO
# if missing).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: virtuoso-credentials
  namespace: fontem-prod
spec:
  type: kv-v2
  mount: secret
  path: fontem-prod/virtuoso
  refreshAfter: 24h
  vaultAuthRef: fontem-prod-vault-auth
  destination:
    create: true
    name: virtuoso-credentials
