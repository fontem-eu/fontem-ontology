# Daily backup_online() at 04:00 UTC. Output lands in /backup
# (the NFS-backed RWX PVC). 7-day retention; the script prunes
# anything older.
#
# Restore drill: spin a throwaway second Virtuoso pod, mount the
# same /backup PVC (RWX), point its DatabaseFile at a copied
# backup, run the smoke verification queries. Documented in the
# runbook (infra/virtuoso/RUNBOOK.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: virtuoso-backup
  namespace: gmr
  labels:
    app: virtuoso
    role: backup
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: virtuoso
            role: backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: openlink/virtuoso-opensource-7:7.2.14
              command: ["/bin/sh", "-c"]
              env:
                - name: DBA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: virtuoso-credentials
                      key: VIRTUOSO_DBA_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              args:
                - |
                  set -euo pipefail
                  STAMP=$(date -u +%Y%m%d-%H%M%S)
                  DEST=/backup/virtuoso-${STAMP}
                  echo "==> backup to $DEST"

                  # backup_online() runs against the live Virtuoso
                  # pod. We talk over the cluster network rather
                  # than executing inside the data pod itself so a
                  # busy database never has the backup process
                  # competing for its memory budget.
                  /opt/virtuoso-opensource/bin/isql \
                      virtuoso.gmr.svc.cluster.local 1111 dba "$DBA_PASSWORD" \
                      -c "EXEC=backup_online ('$DEST/dump-', 50, 0, vector ())"

                  # Retention: keep the 7 most recent backup
                  # directories, prune older ones. Sort by name
                  # works because the timestamp is the directory
                  # suffix.
                  echo "==> pruning backups older than the 7 most recent"
                  ls -1d /backup/virtuoso-* 2>/dev/null \
                      | sort -r | tail -n +8 \
                      | xargs -r rm -rf

                  echo "==> backup complete; current contents:"
                  ls -lh /backup/ | tail -20
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: virtuoso-backup
