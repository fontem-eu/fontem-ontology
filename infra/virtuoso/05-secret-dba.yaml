# Vault-managed dba password for Virtuoso, synced into the gmr
# namespace by the Vault Secrets Operator (VSO) — same pattern as
# neo4j-credentials.
#
# PREREQUISITE: write the secret in Vault before applying:
#   vault kv put secret/gmr/virtuoso \
#       VIRTUOSO_DBA_PASSWORD=<random-32-byte-base64> \
#       VIRTUOSO_DBA_USER=dba
#
# VSO syncs `secret/gmr/virtuoso` into the K8s Secret named
# `virtuoso-credentials` (created by VSO if missing).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: virtuoso-credentials
  namespace: gmr
spec:
  type: kv-v2
  mount: secret
  path: gmr/virtuoso
  refreshAfter: 24h
  vaultAuthRef: gmr-vault-auth
  destination:
    create: true
    name: virtuoso-credentials
