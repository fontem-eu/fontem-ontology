# virtuoso.ini — sized for the staging 2 GiB cgroup.
#
# When the new prod node arrives, edit NumberOfBuffers,
# MaxCheckpointRemap, ServerThreads, and the StatefulSet pod
# resources. Nothing else changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: virtuoso-config
  namespace: gmr
  labels:
    app: virtuoso
data:
  virtuoso.ini: |
    [Database]
    DatabaseFile             = /database/virtuoso.db
    ErrorLogFile             = /database/virtuoso.log
    LockFile                 = /database/virtuoso.lck
    TransactionFile          = /database/virtuoso.trx
    xa_persistent_file       = /database/virtuoso.pxa
    ErrorLogLevel            = 7
    FileExtend               = 200
    MaxCheckpointRemap       = 45000
    Striping                 = 0

    [Parameters]
    ServerPort               = 1111
    LiteMode                 = 0
    DisableUnixSocket        = 1
    DisableTcpSocket         = 0
    NumberOfBuffers          = 180000
    MaxDirtyBuffers          = 130000
    MaxCheckpointRemap       = 45000
    UnremapQuota             = 0
    AtomicDive               = 1
    PrefixResultNames        = 0
    CaseMode                 = 2
    IndexTreeMaps            = 256
    DefaultIsolation         = 2
    MaxClientConnections     = 40
    MaxConnections           = 40
    ServerThreads            = 12
    DirsAllowed              = ., /database, /backup, /import, /opt/virtuoso-opensource/share, /opt/virtuoso-opensource/vad
    MaxQueryCostEstimationTime = 60
    MaxQueryExecutionTime      = 300

    [HTTPServer]
    ServerPort               = 8890
    ServerRoot               = /opt/virtuoso-opensource/vsp
    MaxKeepAlives            = 10
    KeepAliveTimeout         = 10
    HTTPThreadSize           = 280000
    # Bumped from 4 → 16 because a single-threaded sink at ~280 evt/s
    # was saturating all SQL threads, leaving SPARQL read queries
    # starved — /api/data-quality 504'd on the count(SanctionedEntity)
    # call while a bulk replay was in flight. 16 lets a few reads
    # land in parallel without slowing the writer.
    ServerThreads            = 16

    [SPARQL]
    DefaultGraph             = http://data.fontem.eu/graph/data
    ResultSetMaxRows         = 50000
    MaxQueryCostEstimationTime = 60
    MaxQueryExecutionTime      = 300

    [URIQA]
    DefaultHost              = data.fontem.eu

    [Plugins]
    LoadPath                 = /opt/virtuoso-opensource/lib/virtuoso/hosting
    Load1                    = plain, geos
    Load2                    = plain, im
    Load3                    = plain, mediawiki
    Load4                    = plain, rdf_mappers
