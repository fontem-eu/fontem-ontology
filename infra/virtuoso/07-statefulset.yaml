# Virtuoso OS — single-replica StatefulSet on the staging cluster.
#
# Memory limit pinned at 2 GiB per the cluster-wide tightness; the
# virtuoso.ini buffer pool sized to fit comfortably below that. CPU
# is best-effort (5x burst headroom) — Virtuoso is bursty during
# checkpoints and reasoner materialisation.
#
# Headless Service for stable DNS (`virtuoso-0.virtuoso.gmr.svc...`)
# is not strictly needed for a one-replica set, but keeping the
# StatefulSet shape lets us scale to a sharded layout later without
# a manifest rewrite.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: virtuoso
  namespace: gmr
  labels:
    app: virtuoso
spec:
  replicas: 1
  serviceName: virtuoso-headless
  selector:
    matchLabels:
      app: virtuoso
  template:
    metadata:
      labels:
        app: virtuoso
      annotations:
        # Match Neo4j + the rest of the data tier — long-running
        # stateful workloads stay out of the linkerd mesh because
        # the sidecar lifecycle complicates startup ordering and
        # the data-tier traffic is in-cluster only (no Internet
        # exposure that would make mTLS load-bearing).
        linkerd.io/inject: disabled
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: regcred
      containers:
        - name: virtuoso
          image: contribute.void42.internal/golden/virtuoso-opensource-7:7.2.14
          imagePullPolicy: IfNotPresent
          ports:
            - { name: sparql, containerPort: 8890, protocol: TCP }
            - { name: isql,   containerPort: 1111, protocol: TCP }
          env:
            - name: DBA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: virtuoso-credentials
                  key: VIRTUOSO_DBA_PASSWORD
            # The upstream entrypoint reads $VIRTUOSO_INI_FILE only when
            # /database/virtuoso.ini doesn't exist. We deliberately mount
            # the configmap at a non-magic path (see volumes below)
            # instead of subPath-shadowing /database/virtuoso.ini — the
            # subPath approach creates a real file before the entrypoint
            # runs, so its `[ ! -f virtuoso.ini ]` check skips init,
            # which skips password-set and leaves the fresh DB on the
            # default dba/dba credentials.
            - name: VIRTUOSO_INI_FILE
              value: /etc/virtuoso-config/virtuoso.ini
            - name: VIRT_Parameters_NumberOfBuffers
              value: "180000"
            - name: VIRT_Parameters_ServerThreads
              value: "4"
            - name: VIRT_HTTPServer_ServerThreads
              value: "4"
            - name: VIRT_URIQA_DefaultHost
              value: "data.fontem.eu"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              # 4Gi — the buffer pool alone (NumberOfBuffers=180000 ×
              # 8 KiB) wants ~1.5 GiB, and during roll-forward replay
              # transient dirty-buffer overhead pushes past the prior
              # 2 GiB limit. OOM-killed three times in a row trying
              # to recover a busy log; 4 GiB gives the replay enough
              # headroom and matches the working-set we want at
              # steady-state with 16 HTTP threads + 12 SQL threads.
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /database
            - name: backup
              mountPath: /backup
            - name: config
              mountPath: /etc/virtuoso-config
              readOnly: true
          startupProbe:
            tcpSocket: { port: 8890 }
            initialDelaySeconds: 10
            periodSeconds: 10
            # ~60 min cold-start budget. A restart with a busy sink can
            # leave ~3M unflushed transactions to roll forward at
            # ~5k tx/s — the prior 3-min budget killed us mid-replay
            # and we crash-looped, each retry having a longer log than
            # the last because the sink kept writing.
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /sparql?query=ASK%20%7B%7D
              port: 8890
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8890 }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
        # Sidecar — translates `isql status('')` + a SPARQL ASK
        # probe into Prometheus metrics on :9477. Lives in the
        # same pod so it can talk to localhost without crossing
        # any Service boundary.
        - name: exporter
          image: contribute.void42.internal/golden/virtuoso-exporter:0.1.2
          imagePullPolicy: IfNotPresent
          env:
            - name: DBA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: virtuoso-credentials
                  key: VIRTUOSO_DBA_PASSWORD
          ports:
            - { name: metrics, containerPort: 9477, protocol: TCP }
          resources:
            requests: { cpu: 10m,  memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /metrics, port: 9477 }
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: virtuoso-data
        - name: backup
          persistentVolumeClaim:
            claimName: virtuoso-backup
        - name: config
          configMap:
            name: virtuoso-config
            items:
              - { key: virtuoso.ini, path: virtuoso.ini }
---
# Headless Service for the StatefulSet's stable DNS name. ETLs and
# the consolidator address virtuoso via the regular ClusterIP
# Service `virtuoso` defined in 08-services.yaml.
apiVersion: v1
kind: Service
metadata:
  name: virtuoso-headless
  namespace: gmr
  labels:
    app: virtuoso
spec:
  clusterIP: None
  selector:
    app: virtuoso
  ports:
    - { name: sparql,  port: 8890, protocol: TCP }
    - { name: isql,    port: 1111, protocol: TCP }
    - { name: metrics, port: 9477, protocol: TCP }
