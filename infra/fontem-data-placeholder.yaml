---
apiVersion: v1
kind: Namespace
metadata:
  name: fontem
  labels:
    app.kubernetes.io/part-of: fontem
---
# Tiny placeholder so data.fontem.eu has SOMETHING to return during
# Phase 0 of the Neo4j → Virtuoso migration. Replaced by Virtuoso's
# real Service in Phase 1; the NodePort number stays the same so the
# bastion's nginx config doesn't have to change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fontem-data-placeholder-html
  namespace: fontem
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Fontem Knowledge Graph</title>
      <style>
        body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem;
               margin: 4rem auto; padding: 0 1rem; color: #1a1a1a; }
        h1 { font-size: 1.6rem; margin: 0 0 1rem; }
        code { background: #f4f4f4; padding: 0 0.3rem; border-radius: 3px; }
        a { color: #0a4; }
      </style>
    </head>
    <body>
      <h1>Fontem knowledge graph</h1>
      <p>This host (<code>data.fontem.eu</code>) will serve the Fontem
        SPARQL endpoint and entity IRIs. The migration to RDF/OWL is
        in progress — see
        <a href="https://contribute.void42.internal/golden/fontem-ontology">fontem-ontology</a>
        for the design and plan.</p>
      <p>Phase 0 placeholder.</p>
    </body>
    </html>
  fontem-data.conf: |
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        # Healthcheck for k8s probes — unauthenticated, plain text.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fontem-data-placeholder
  namespace: fontem
  labels:
    app: fontem-data-placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fontem-data-placeholder
  template:
    metadata:
      labels:
        app: fontem-data-placeholder
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: fontem-data.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: html
          configMap:
            name: fontem-data-placeholder-html
            items: [{ key: index.html, path: index.html }]
        - name: nginx-conf
          configMap:
            name: fontem-data-placeholder-html
            items: [{ key: fontem-data.conf, path: fontem-data.conf }]
---
apiVersion: v1
kind: Service
metadata:
  name: fontem-data
  namespace: fontem
  labels:
    app: fontem-data-placeholder
spec:
  type: NodePort
  selector:
    app: fontem-data-placeholder
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31457
      protocol: TCP
